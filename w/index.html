:root{
  --ease:cubic-bezier(.65,.05,.36,1);--ink:cubic-bezier(.45,0,.2,1);
  --lapis:#1B2F6E;--ivory:#F4ECDC;--gold:#B08C57;--gold-deep:#8B6D3F;
  --fg:#F4ECDC;--ac:#C9A86F;--fg2:rgba(244,236,220,.62);
  --ew:min(88vw, calc(70vh * 1.348), 900px);
  --ch:min(calc(100vh - 236px), calc(84vw * 1.4), 760px);
}
@supports (height:100dvh){:root{
  --ew:min(88vw, calc(70dvh * 1.348), 900px);
  --ch:min(calc(100dvh - 236px), calc(84vw * 1.4), 760px);
}}
:root{--u:calc(var(--ew) / 558);--cw:calc(var(--ch) * 360 / 504)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0F1B44;color:var(--fg)}
body{font-family:'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:none;transition:color 1.6s var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ac);outline-offset:6px;border-radius:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* scene grounds: the page moves through each function's colour */
#bg i{position:fixed;inset:0;opacity:0;transition:opacity 1.9s var(--ink)}
#bg [data-s=intro]{background:#1B2F6E}
#bg [data-s=table]{background:radial-gradient(110% 85% at 50% 40%,#F7F1E5 0%,#EADFCC 55%,#D3C6AF 100%)}
#bg [data-s=c0]{background:radial-gradient(110% 85% at 50% 38%,#EFE5D1 0%,#DDCFB4 55%,#BFAE8E 100%)}
#bg [data-s=c1]{background:radial-gradient(110% 85% at 50% 38%,#FBF4E0 0%,#F0E2BC 55%,#D8C08C 100%)}
#bg [data-s=c2]{background:radial-gradient(110% 85% at 50% 38%,#3A4222 0%,#2A3018 55%,#14170B 100%)}
#bg [data-s=c3]{background:radial-gradient(110% 85% at 50% 38%,#ECE4D4 0%,#DAD0BC 55%,#BCAF96 100%)}
#bg [data-s=c4]{background:radial-gradient(110% 85% at 50% 38%,#3C121B 0%,#2A0B12 55%,#130407 100%)}
#bg [data-s=c5]{background:radial-gradient(110% 85% at 50% 38%,#1E2540 0%,#151A2F 55%,#080A14 100%)}
#bg [data-s=fin]{background:radial-gradient(110% 85% at 50% 40%,#22397F 0%,#1B2F6E 50%,#0D1840 100%)}
body[data-scene=intro] #bg [data-s=intro],body[data-scene=table] #bg [data-s=table],body[data-scene=c0] #bg [data-s=c0],
body[data-scene=c1] #bg [data-s=c1],body[data-scene=c2] #bg [data-s=c2],body[data-scene=c3] #bg [data-s=c3],
body[data-scene=c4] #bg [data-s=c4],body[data-scene=c5] #bg [data-s=c5],body[data-scene=fin] #bg [data-s=fin]{opacity:1}
body[data-scene=table],body[data-scene=c0],body[data-scene=c1],body[data-scene=c3]{--fg:#1B2F6E;--ac:#8B6D3F;--fg2:rgba(27,47,110,.78)}
body[data-scene=c2]{--fg:#F4ECDC;--ac:#D8BC86;--fg2:rgba(244,236,220,.8)}
body[data-scene=c4]{--fg:#F4ECDC;--ac:#D8BC86;--fg2:rgba(244,236,220,.8)}
body[data-scene=c5]{--fg:#EDEEF2;--ac:#C9CBD3;--fg2:rgba(237,238,242,.78)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#lamp{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.2s;mix-blend-mode:soft-light;
  background:radial-gradient(42vmax 42vmax at var(--mx,50%) var(--my,40%),rgba(255,236,200,.55),rgba(255,236,200,0) 70%)}
.fine #lamp{opacity:1}

#stage{position:fixed;inset:0;z-index:2;display:grid;place-items:center}
.scene{position:absolute;inset:0;display:grid;place-items:center;visibility:hidden}
.scene.on{visibility:visible}

/* ---------- envelope ---------- */
#env .wrap{position:relative;width:var(--ew);height:calc(var(--ew) * 414 / 558);transform-origin:50% 50%}
#env .body{position:absolute;inset:0;transform-origin:49.84% 27.37%}
#env .lift{position:absolute;inset:0}
.env-shadow{position:absolute;left:2%;right:2%;top:5%;bottom:.6%;border-radius:4px;opacity:0;background:#1B2F6E;
  box-shadow:0 calc(var(--u)*22) calc(var(--u)*46) rgba(18,14,8,.38),0 calc(var(--u)*4) calc(var(--u)*8) rgba(18,14,8,.22);transition:opacity 1.6s var(--ink)}
.on-table .env-shadow{opacity:1}
.env-front,.env-back{position:absolute;inset:0}
.env-front svg{width:100%;height:100%;display:block}
.env-back{visibility:hidden;perspective:calc(var(--ew) * 2.6)}
.turned .env-back{visibility:visible}
.turned .env-front{visibility:hidden}
.env-back>svg,.env-back>.proxies{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.env-back>svg.liner{z-index:0;overflow:hidden}
/* clip/mask geometry referenced by <use> lives inside hidden scenes; keep it active */
clipPath *,mask *{visibility:visible}
.proxies{z-index:2}
.pocket{z-index:3;pointer-events:none}
.env-back>svg.sealB{z-index:5;pointer-events:none}
.s-bot{transform-box:fill-box;transform-origin:50% 0}
.flap{position:absolute;left:0;top:0;width:100%;height:calc(var(--u) * 244.8);z-index:4;transform-origin:50% 0;transform-style:preserve-3d}
.flap.behind{z-index:1}
.flap>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap>div>svg{width:100%;height:100%;display:block;overflow:visible}
.flap .fin{transform:rotateX(180deg)}
.flap .fout svg{filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*2.5) rgba(10,14,40,.35))}
.proxy{position:absolute;left:calc(var(--u) * 27);width:calc(var(--u) * 504);height:calc(var(--u) * 360);
  box-shadow:0 calc(var(--u)*-1) calc(var(--u)*3) rgba(0,0,0,.18)}
.proxy svg{width:100%;height:100%;display:block}
.paper,.gloss{position:absolute;inset:0;pointer-events:none;display:block}
.paper{mix-blend-mode:multiply;opacity:.75;background-image:inherit}
.env-front .paper,.face .paper{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .33  0 0 0 0 .24  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.gloss{mix-blend-mode:soft-light;opacity:0;transition:opacity .8s;
  background:radial-gradient(60% 45% at var(--gx,50%) var(--gy,30%),rgba(255,248,230,.7),rgba(255,248,230,0) 70%)}
.fine .gloss{opacity:1}
#env .hit{position:absolute;inset:-4%;z-index:10;border-radius:6px}
.seal{cursor:pointer}

/* hint: Jost caps with a nuqta that breathes like a loader */
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 5.5vh);z-index:5;text-align:center;pointer-events:none;
  font:500 11px/1 Jost,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--fg2);opacity:0;transition:opacity 1.2s var(--ink)}
#hint.show{opacity:1}
#hint b{display:inline-block;width:5px;height:5px;margin:0 14px 1px;background:var(--ac);transform:rotate(45deg);animation:breathe 2.4s var(--ink) infinite}
@keyframes breathe{50%{opacity:.25;transform:rotate(45deg) scale(.6)}}
#skip{position:fixed;right:calc(env(safe-area-inset-right) + 22px);top:calc(env(safe-area-inset-top) + 18px);z-index:6;
  font:500 10px/1 Jost,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--fg2);opacity:0;transition:opacity 1s;padding:10px}
#skip.show{opacity:1}
/* the threshold: shown only where the browser keeps sound asleep until the guest touches the page */
#gate{position:fixed;inset:0;z-index:7;display:none;place-content:center;justify-items:center;gap:20px;background:#1B2F6E;border:0;padding:0;outline:none;
  color:#D8BC86;font:500 11px/1 Jost,sans-serif;letter-spacing:.32em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .9s var(--ink)}
#gate.show{display:grid}
#gate.in{opacity:1}
#gate b{width:7px;height:7px;background:#D8BC86;transform:rotate(45deg);animation:breathe 2.4s var(--ink) infinite}
#gate small{font:italic 400 16px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;text-transform:none;opacity:.62}

/* ---------- deck ---------- */
#deck{grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#chap{text-align:center;min-height:86px;transition:color 1.6s var(--ink)}
#chap .l1{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:400;font-style:italic;font-size:clamp(21px,2.3vw,28px);line-height:1.15;color:var(--fg)}
#chap .l1 .no{font-style:normal;font-weight:500;font-size:.62em;letter-spacing:.2em;color:var(--ac);margin-right:-4px}
#chap .l1 .hr{width:clamp(22px,4vw,46px);height:1px;background:var(--ac);opacity:.7}
#chap .ur{font-family:Gulzar,serif;font-style:normal;font-size:1.05em;direction:rtl}
#chap .l2{margin-top:9px;font:500 10.5px/1.5 Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--fg2)}
#chap .l3{margin-top:2px;font-style:italic;font-size:15px;color:var(--fg2)}
#chap>div{transition:opacity .9s var(--ink),transform .9s var(--ink)}
#chap.out>div{opacity:0;transform:translateY(-6px)}
#cards{position:relative;width:var(--cw);height:var(--ch);align-self:center;justify-self:center}
.card{position:absolute;inset:0;perspective:calc(var(--ch) * 3.2);visibility:hidden;outline:none}
.card.vis{visibility:visible}
.card .shadow{position:absolute;inset:1.5% 2% 0;border-radius:3px;transform-origin:50% 50%;
  box-shadow:0 calc(var(--ch)*.035) calc(var(--ch)*.07) rgba(12,8,4,.34),0 calc(var(--ch)*.006) calc(var(--ch)*.012) rgba(12,8,4,.25)}
.tilt,.flip{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:1.5px;background:#FAF6EE}
.face .cs{width:100%;height:100%;display:block}
svg.cs,#env svg{font-variant-numeric:lining-nums}
.face.back{transform:rotateY(180deg)}
.card .face{cursor:pointer}
.qr{position:absolute;display:block;border-radius:2px;outline:1px solid transparent;transition:outline-color .6s,box-shadow .6s}
.qr span{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);white-space:nowrap;font:500 8.5px/1 Jost,sans-serif;letter-spacing:.24em;
  text-transform:uppercase;color:inherit;opacity:0;transition:opacity .6s}
.qr:hover,.qr:focus-visible{outline-color:rgba(176,140,87,.8);box-shadow:0 0 0 4px rgba(176,140,87,.12)}
.mk{transform-box:fill-box}

/* controls */
#acts{display:flex;justify-content:center;align-items:center;gap:6px 22px;flex-wrap:wrap;margin-top:18px;font:500 10.5px/1 Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase}
#acts>*{color:var(--fg);opacity:.86;text-decoration:none;padding:8px 2px 10px;position:relative;transition:opacity .4s;font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;cursor:pointer}
#acts>*:hover{opacity:1}
#acts i{width:3px;height:3px;background:var(--ac);transform:rotate(45deg);padding:0;opacity:.8}
#acts.solo>:not(#aFlip){display:none}
#chap .no:empty{display:none}
/* kashida underline: grows from the right like the Urdu stroke */
.ul::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1px;background:var(--ac);transform:scaleX(0);transform-origin:100% 50%;transition:transform .9s var(--ink)}
.ul:hover::after,.ul:focus-visible::after{transform:scaleX(1);transform-origin:0 50%}
.nav{position:absolute;top:50%;z-index:4;display:flex;align-items:center;gap:14px;transform:translateY(-50%);color:var(--fg);padding:16px 8px;transition:opacity .8s var(--ink)}
.nav[disabled]{opacity:0;pointer-events:none}
#prev{right:calc(50% + var(--cw) / 2 + 36px);flex-direction:row-reverse}
#next{left:calc(50% + var(--cw) / 2 + 36px)}
.nav .lb{display:flex;flex-direction:column;gap:6px;font-style:italic;font-size:17px;white-space:nowrap;color:var(--fg2);transition:color .6s}
#prev .lb{text-align:right}
.nav .lb small{font:500 9.5px/1 Jost,sans-serif;font-style:normal;letter-spacing:.28em;text-transform:uppercase;color:var(--ac)}
.nav svg{width:64px;height:12px;overflow:visible}
.nav svg path{stroke:var(--ac);fill:none;stroke-width:1;transition:transform .8s var(--ink);transform-origin:100% 50%}
.nav svg rect{fill:var(--ac)}
#prev svg{transform:scaleX(-1)}
.nav:hover .lb{color:var(--fg)}
.nav:hover svg path{transform:scaleX(1.25)}
#dots{display:flex;justify-content:center;gap:16px;margin-top:6px}
#dots button{width:20px;height:20px;display:grid;place-items:center}
#dots button::before{content:"";width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--ac);transition:background .6s,transform .6s}
#dots button[aria-current=true]::before{background:var(--ac);transform:rotate(45deg) scale(1.35)}
@media (max-width:980px),(max-aspect-ratio:1/1){
  #prev,#next{top:auto;bottom:calc(env(safe-area-inset-bottom) + 6px);transform:none;padding:12px 6px}
  #prev{right:auto;left:calc(env(safe-area-inset-left) + 10px)}
  #next{left:auto;right:calc(env(safe-area-inset-right) + 10px)}
  .nav .lb{display:none}
  .nav svg{width:44px}
  #deck{padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
}
@media (max-width:520px){
  #chap .l2{letter-spacing:.16em;font-size:10px}
  #acts{gap:6px 14px;letter-spacing:.16em;font-size:10px}
}
@media (max-height:560px) and (min-aspect-ratio:1/1){
  :root{--ch:calc(100vh - 150px)}
  #chap{min-height:0}#chap .l3{display:none}
}

/* ---------- finale ---------- */
#fin{text-align:center;color:#F4ECDC;padding:24px}
#fin .col{display:flex;flex-direction:column;align-items:center;max-width:620px}
#fin .seal-star{width:clamp(110px,16vh,150px);height:clamp(110px,16vh,150px);overflow:visible}
#fin .urn{font-family:Gulzar,serif;font-size:clamp(22px,3vh,28px);margin-top:10px;color:#D8BC86;direction:rtl}
#fin .inv{font-style:italic;font-size:clamp(17px,2.3vh,21px);line-height:1.5;color:rgba(244,236,220,.78);margin-top:8px}
#fin h2{font-weight:300;font-size:clamp(44px,7.4vh,78px);line-height:1;margin:8px 0 2px;letter-spacing:.01em}
#fin h2 em{font-weight:400;color:#D8BC86;padding:0 .12em}
#fin .ksh{width:min(260px,60vw);height:20px;margin:6px 0}
#fin .dl{font:500 10.5px/1.6 Jost,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,236,220,.62)}
#fan{position:relative;height:clamp(120px,19vh,190px);width:min(560px,92vw);margin:clamp(14px,3vh,34px) 0 8px}
#fan button{position:absolute;left:50%;bottom:0;width:calc(clamp(120px,19vh,190px) * .714);height:100%;transform-origin:50% 140%;
  box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .9s var(--ink);border-radius:1px;overflow:hidden}
#fan button svg{width:100%;height:100%;display:block}
#fan button:hover,#fan button:focus-visible{z-index:3}
#fan button{transform:var(--t)}
#fan button:hover,#fan button:focus-visible{transform:var(--t) translateY(-12%)}
#deck>header,#deck>footer,#deck>.nav{transition:opacity 1.3s var(--ink)}
#deck.bare>header,#deck.bare>footer,#deck.bare>.nav{opacity:0;pointer-events:none}
#fin .again{margin-top:14px;font:500 10.5px/1 Jost,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(244,236,220,.78);padding:10px 2px;position:relative}
#fin .rev{opacity:0}
@media (max-width:560px){
  #fin{padding:16px 12px}
  #fin .seal-star{width:clamp(84px,12vh,120px);height:clamp(84px,12vh,120px)}
  #fin .urn{font-size:22px;margin-top:4px}
  #fin .inv{font-size:16px}
  #fin h2{font-size:clamp(38px,11vw,48px)}
  #fan{height:clamp(96px,15vh,140px);width:min(560px,96vw);margin:12px 0 4px}
  #fan button{width:calc(clamp(96px,15vh,140px) * .714)}
}
.petals{position:fixed;inset:0;z-index:7;pointer-events:none}
.petal{position:fixed;top:-40px;left:0;pointer-events:none;width:22px;height:22px}

/* ---------- cursor ---------- */
#cur{position:fixed;left:0;top:0;z-index:20;pointer-events:none;display:none}
.fine #cur{display:block}
.fine,.fine button,.fine a,.fine .face{cursor:none}
#cur .dot{position:absolute;width:5px;height:5px;margin:-2.5px;background:var(--ac);transform:rotate(45deg);transition:background 1.2s}
#cur .ring{position:absolute;width:36px;height:36px;margin:-18px;border:1px solid var(--ac);border-radius:50%;opacity:.55;
  display:grid;place-items:center;transition:width .6s var(--ink),height .6s var(--ink),margin .6s var(--ink),opacity .6s,border-color 1.2s}
#cur .ring span{font:500 8.5px/1 Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--fg);opacity:0;transition:opacity .4s;padding-left:.24em}
#cur.lab .ring{width:74px;height:74px;margin:-37px;opacity:1}
#cur.lab .ring span{opacity:1}
#cur.lab .dot{opacity:0}
#cur .dot{transition:background 1.2s,opacity .3s}
#cur.down .ring{width:28px;height:28px;margin:-14px}
#noscript{position:fixed;inset:0;display:grid;place-items:center;color:#F4ECDC;background:#1B2F6E;z-index:99;padding:30px;text-align:center}
</style>
</head>

<form id="aagf" style="width:min(100%,380px);display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto">
<div style="height:1px;background:#B08C57;width:64px;margin:0 auto 6px"></div>
<div style="font-family:Jost,Futura,sans-serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C9A86F">An invitation</div>

<input id="gp" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" style="font:500 20px Jost,Futura,sans-serif;padding:14px 16px;border:1.5px solid #B08C57;background:#F4ECDC;color:#1B2F6E;text-align:center">
<label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:17px;color:#E6DCC6"><input type="checkbox" id="gs" style="width:20px;height:20px;margin:0"> Show the word</label>
<button id="gb" type="submit" style="font:600 17px Jost,Futura,sans-serif;letter-spacing:.08em;background:#B08C57;color:#1B2F6E;border:0;padding:14px 16px;min-height:48px;cursor:pointer">Open the invitation</button>

<script>
(function(){
var SALT="bmgLuBdeRh/xvf9NmCSOKg==",IV="iuQJMgMkow/eDfRO",ITER=300000,SLOT="aa-inv-w";
var g=document.getElementById('aagate'),f=document.getElementById('aagf'),p=document.getElementById('gp'),e=document.getElementById('ge'),bt=document.getElementById('gb');
function b(s){var x=atob(s),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function store(k){try{localStorage.setItem(SLOT,k)}catch(_){}}
function stored(){try{return localStorage.getItem(SLOT)||''}catch(_){return ''}}
function open(w){
  var pass=String(w).trim().toLowerCase();
  if(!window.crypto||!crypto.subtle){e.textContent='This browser cannot open the invitation. Please use a current browser.';return Promise.reject()}
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
  .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},k,b(document.getElementById('sealed').textContent.trim()))})
  .then(function(buf){
    store(pass);
    document.body.innerHTML=new TextDecoder().decode(buf);
    Array.prototype.forEach.call(document.body.querySelectorAll('script'),function(o){var n=document.createElement('script');n.textContent=o.textContent;o.parentNode.replaceChild(n,o)});
  });
}
document.getElementById('gs').addEventListener('change',function(ev){p.type=ev.target.checked?'text':'password'});
f.addEventListener('submit',function(ev){ev.preventDefault();e.textContent='';bt.disabled=true;
  open(p.value).catch(function(){if(!e.textContent)e.textContent='That word does not open this invitation.';bt.disabled=false})});
var m=/(?:^#|[#&])k=([^&]+)/.exec(location.hash), k=m?decodeURIComponent(m[1]):stored();
if(m&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);
if(k)open(k).catch(function(){e.textContent='';bt.disabled=false});
})();
</script>
