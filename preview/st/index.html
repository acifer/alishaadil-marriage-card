function parts(ms){ ms = Math.max(0, ms); return [Math.floor(ms/864e5), Math.floor(ms%864e5/36e5), Math.floor(ms%36e5/6e4), Math.floor(ms%6e4/1e3)]; }
function two(n){ return (n < 10 ? '0' : '') + n; }
var U = ['d','h','m','s'].map(function(k){ return document.querySelector('#timer [data-k=' + k + ']'); }), DL = document.querySelector('#timer [data-l=d]');
var cur = null, lastSr = '';
function render(force){

    var R = document.documentElement.style;

    $('kick').textContent = m.kick || ''; $('kick').hidden = !m.kick;
    $('name').textContent = m.name; $('name').hidden = !!m.count;
    $('name').classList.toggle('long', !!m.thanks);
    $('until').textContent = m.until || ''; $('until').hidden = !m.count;
    var sub = m.now || m.sub || '';

/* the first frame is already in the moment's colour; the ground only glides when the moment changes while the page is open */
document.documentElement.classList.add('still');
render(true);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.documentElement.classList.remove('still'); }); });
var ticker = setInterval(render, 1000);

/* ---------- the way in: calligraphy + nuqta; the nuqta spreads as ink and the invitation opens in this page ---------- */
var door = $('door'), dot = door.querySelector('.dot path:not(.halo)');
var hintT = setTimeout(function(){ door.classList.add('hint'); }, 3000);
/* many guests tap the biggest thing on the screen: the monogram opens the invitation too (the ink still starts at the nuqta) */
document.querySelector('#story .logo').addEventListener('click', function(){ door.click(); });

/* get the guest's invitation ready while they read: its page, its key (the key that opened this page opens it too:
   both are sealed with the same salt and word), and its pieces in the cache */
var INV = {html:null, ready:null};
function idb(){ return new Promise(function(res, rej){ var r = indexedDB.open('aa-keys', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('k'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }

    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(salt), iterations:iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['decrypt']); });
}
function prepare(){
  if(INV.ready) return INV.ready;
  var base = new URL(CFG.card, location.href);
  INV.ready = fetch(base.href, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('invitation ' + r.status); return r.text(); })
  .then(function(html){
    var m = /var SALT="([^"]+)",ITER=(\d+),SLOT="([^"]+)",PIECES=(\[[^\]]*\])/.exec(html);
    if(!m){ INV.html = html; return; }   // an open page: nothing to unlock
    var salt = m[1], iter = +m[2], slot = m[3], pieces = JSON.parse(m[4]), Z = typeof DecompressionStream !== 'undefined';
    pieces.forEach(function(P){ fetch(new URL(Z ? P.z : P.u, base).href).catch(function(){}); });
    try{ if(WORD) localStorage.setItem(slot, WORD); }catch(_){}
    var key = (window.__AA_KEY && window.__AA_SALT === salt) ? Promise.resolve(window.__AA_KEY) : (WORD ? derive(WORD, salt, iter) : Promise.reject(new Error('no word')));
    return key.then(function(k){ return idb().then(function(d){ return new Promise(function(res){ var tx = d.transaction('k', 'readwrite'); tx.objectStore('k').put(k, slot + ':' + salt); tx.oncomplete = res; tx.onerror = res; tx.onabort = res; }); }); })
      .then(function(){ INV.html = html; });
  });

var idle = window.requestIdleCallback || function(f){ return setTimeout(f, 1200); };

  try{ Object.keys(localStorage).forEach(function(k){ if(/^aa-inv-/.test(k)) localStorage.removeItem(k); }); }catch(_){}
  try{ if(indexedDB.databases) indexedDB.databases().then(function(l){ if(!l.some(function(x){ return x.name === 'aa-keys'; })) throw 0; return idb(); }).then(function(d){ var tx = d.transaction('k', 'readwrite'), st = tx.objectStore('k');
    st.getAllKeys().onsuccess = function(e){ (e.target.result || []).forEach(function(k){ if(/^aa-inv-/.test(String(k))) st.delete(k); }); }; }).catch(function(){}); }catch(_){}
}
setTimeout(function(){ idle(tidy); }, 4000);
setTimeout(function(){ idle(function(){ prepare(); }); }, 1500);
door.addEventListener('pointerenter', prepare); door.addEventListener('focus', prepare);

/* the invitation, written into this page: same window, so the sound unlocked by the tap carries over */
function swap(){
  if(!INV.html){ location.href = cardHref; return; }
  try{
    var doc = new DOMParser().parseFromString(INV.html.replace(/<(div|main) id="aagate" style="/, '<$1 id="aagate" style="visibility:hidden;'), 'text/html');
    clearInterval(ticker); clearTimeout(hintT);
    window.removeEventListener('hashchange', route);
    history.pushState({aa:'invitation'}, '', new URL(CFG.card, location.href).href);
    document.title = doc.title;
    document.documentElement.removeAttribute('style');
    document.head.replaceWith(document.importNode(doc.head, true));
    var body = document.importNode(doc.body, true);
    /* hold the lapis the ink settled into until the invitation has drawn its own first frame (no dark blink in between) */
    body.style.background = LAPIS; document.documentElement.style.background = LAPIS;
    var held = new MutationObserver(function(){ if(document.documentElement.classList.contains('go')){ body.style.removeProperty('background'); document.documentElement.style.removeProperty('background'); held.disconnect(); } });
    held.observe(document.documentElement, {attributes:true, attributeFilter:['class']});
    document.body.replaceWith(body);
    Array.prototype.forEach.call(body.querySelectorAll('script'), function(o){ var n = document.createElement('script'); n.textContent = o.textContent; o.parentNode.replaceChild(n, o); });
    setTimeout(function(){ var g = document.getElementById('aagate'); if(g) g.style.visibility = 'visible'; }, 3500);
    window.addEventListener('popstate', function(){ location.reload(); });
  }catch(_){ location.href = cardHref; }
}
var INK = '#0F1B44', LAPIS = '#1B2F6E', going = false;   /* LAPIS = the invitation's first ground */
function mix(a, b, t){ var A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), o = '#';
  for(var sh = 16; sh >= 0; sh -= 8){ var x = Math.round(((A >> sh) & 255) * (1 - t) + ((B >> sh) & 255) * t); o += (x < 16 ? '0' : '') + x.toString(16); } return o; }
door.addEventListener('click', function(e){
  if(e.button > 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); if(going) return; going = true;

  try{ var C = window.AudioContext || window.webkitAudioContext; if(C && !window.__AA_AC) window.__AA_AC = new C(); if(window.__AA_AC && window.__AA_AC.resume) window.__AA_AC.resume(); }catch(_){}

});
/* returning with the browser's back button after the invitation was opened in a new tab or page: show the page again */
window.addEventListener('pageshow', function(e){ if(e.persisted){ going = false; door.classList.remove('opening'); $('ink').style.display = 'none'; document.body.style.background = ''; document.documentElement.style.background = ''; } });

/* ---------- Reply: the reply lives at the end of the invitation; here one quiet line leads to it ---------- */
var KEY = 'aa-rsvp-' + CFG.guest;
function saved(){ try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){ return null; } }
function rsvpLabel(){

  a.textContent = s ? 'Change your reply' : 'RSVP'; $('rsPre').hidden = true;
  note.textContent = s ? 'Thank you for your reply' : 'Kindly reply by ' + CFG.rsvpByText; note.hidden = false;
}
rsvpLabel();
window.addEventListener('pageshow', rsvpLabel); window.addEventListener('storage', rsvpLabel);
/* old links to the form that used to be on this page lead to the reply in the invitation */
function oldLink(){ if(location.hash === '#rsvp' || location.hash === '#sent') location.replace(CFG.card + '#reply'); }
oldLink(); window.addEventListener('hashchange', oldLink);
function route(){}
})();
