    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ document.body.style.transition = 'none'; document.documentElement.style.background = LAPIS; document.body.style.background = LAPIS; document.body.style.opacity = '0'; return setTimeout(res, 120); }
    var svg = $('ink'), p = svg.querySelector('path');
    var r = dot.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, W = innerWidth, H = innerHeight;
    var far = Math.max(Math.hypot(cx, cy), Math.hypot(W-cx, cy), Math.hypot(cx, H-cy), Math.hypot(W-cx, H-cy));
    var s0 = 1.2, S = far / 2.4, t0 = performance.now(), DUR = 950;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.style.display = 'block'; door.classList.remove('hint');
    (function f(t){
      var k = Math.min(1, (t - t0) / DUR), q = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
      p.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') rotate(' + (q*9) + ') scale(' + (s0 + (S - s0)*q) + ')');
      p.style.fill = k < .18 ? GOLD : mix(INK, LAPIS, Math.max(0, Math.min(1, (k - .55) / .45)));
      if(k < 1) requestAnimationFrame(f); else { document.documentElement.style.background = LAPIS; document.body.style.background = LAPIS; res(); }
    })(t0);
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260); });
  inked.then(function(){
    return Promise.race([ready, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('slow')); }, 6000); })]);
  }).then(swap, function(){ location.href = cardHref; });
});
