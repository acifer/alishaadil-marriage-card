<style>
:root{--lapis:#1B2F6E;--night:#0E1A44;--gold:#CFAE72;--ivory:#F2E9D6;--quiet:#C3BBA6;--live:#D2553A;--slow:cubic-bezier(.65,0,.25,1);--ink:cubic-bezier(.45,0,.2,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--lapis);color:var(--ivory)}
body{font:17px/1.5 Jost,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{max-width:520px;margin:0 auto;min-height:100vh;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{font:italic 400 19px 'Cormorant Garamond',Georgia,serif;color:var(--ivory);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.top .mini{width:54px;height:auto}.top i{width:54px}
.head{text-align:center;margin-top:10px}
.head h1{margin:0;font:400 32px/1.15 'Cormorant Garamond',Georgia,serif}
.head p{margin:4px 0 0;font-size:15px;color:var(--quiet)}
.kashida{display:block;width:120px;height:auto;margin:12px auto 0;fill:var(--gold);opacity:.8;overflow:visible}
.stage{position:relative;flex:1;display:flex;justify-content:center;align-items:flex-start;gap:6%;margin-top:26px}
.win{position:relative;width:44%;max-width:210px;--door:#14245A;--inside:#0B1433;--l1:#FFEBC2;--l2:#E7C98E;transition:opacity .6s var(--ink)}
.win[data-w="r"]{--door:#4A1220;--inside:#1E0710;--l1:#FFE0D2;--l2:#E3A98F}
.arch{position:relative;width:100%;aspect-ratio:212/326;perspective:900px}
.arch>svg,.door{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.door svg{display:block;width:100%;height:100%}
.glow,.frame,.door{pointer-events:none}
.win.open .video{z-index:3}.win.open .base{z-index:4}.crown{z-index:5}
.door{transform-style:preserve-3d;backface-visibility:hidden}
.door.l{transform-origin:7.55% 50%}.door.r{transform-origin:92.45% 50%}
.door .shade{opacity:0}
.frame path{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round}
.frame .star path{fill:var(--lapis);stroke:var(--gold);stroke-width:9;stroke-linejoin:miter}
.spark{stroke:#FFF3D6!important;stroke-width:3!important;stroke-dasharray:.035 .965!important;stroke-dashoffset:1;opacity:0}
.glow .light{opacity:0}
/* the picture sits exactly in the body of the inner arch: full width of the opening, from where the crown meets the sides */
.video{position:absolute;left:7.55%;width:84.9%;top:47.85%;aspect-ratio:16/9;background:#05091C;opacity:0;display:grid;place-items:center;text-align:center;
  font:400 14px/1.35 Jost,sans-serif;color:var(--quiet);padding:0 10px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.base{position:absolute;left:7.55%;width:84.9%;top:79.2%;bottom:1.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;pointer-events:none}
.base .bt{font:400 19px/1.1 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}
.base .close{font:500 11px/1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--quiet);padding:10px 14px;min-height:40px}
.base .close:hover{color:var(--gold)}
.hit{position:absolute;left:4%;right:4%;top:10%;bottom:0;cursor:default}
.crown{position:absolute;left:41%;width:18%;top:-1%;aspect-ratio:1;border-radius:50%;display:none}
.cap{text-align:center;margin-top:12px}
.cap h2{margin:0;font:400 21px/1.15 'Cormorant Garamond',Georgia,serif}
.cap .when{margin:6px 0 0;font:500 10.5px/1.4 Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.cap .yours{margin:3px 0 0;font:400 13.5px/1.3 Jost,sans-serif;color:var(--quiet);min-height:1em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(210,85,58,.25)}
.foot{margin-top:28px;text-align:center;font-size:15px;color:var(--quiet)}
.foot a{color:var(--ivory);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}

/* moments of a window */
.win .frame .draw{stroke-dasharray:1;stroke-dashoffset:0}
.win.drawing .frame .draw{stroke-dashoffset:1;animation:draw 2.4s var(--slow) forwards}
.win.drawing .frame .i{animation-delay:.5s}
.win.drawing .door{opacity:0;animation:fade 1.3s ease 1.2s forwards}
.win.drawing .star{opacity:0;animation:fade .9s ease 2s forwards}
.win.live .glow .light{opacity:.9;animation:breathe 4.2s ease-in-out infinite}
.win.live .spark{opacity:1;animation:spark 6s linear infinite}
.win.live .star path{animation:twinkle 4.2s ease-in-out infinite}
.win.live .hit{cursor:pointer}
.win.after .door{filter:saturate(.7)}
/* one window open: it comes forward to the full width, the other steps back */
.stage.has-open .win:not(.open):not(.closing){opacity:0;pointer-events:none}
.win.lift{position:fixed;z-index:20;max-width:none;margin:0;transition:left .9s var(--slow),top .9s var(--slow),width .9s var(--slow)}
.win.open .door{will-change:transform;transition:transform 1.5s cubic-bezier(.3,0,.12,1) .75s}
.win.open .door .shade{opacity:.45;transition:opacity 1.5s .75s}
.win.open .door.l{transform:rotateY(-108deg)}.win.open .door.r{transform:rotateY(108deg)}
.win.open .glow .light{opacity:1;animation:bloom 2.6s ease .75s forwards}
.win.open .video{opacity:1;transition:opacity .8s ease 1.55s}
.win.open .base{opacity:1;pointer-events:auto;transition:opacity .8s ease 1.9s}
.win.open .cap,.win.lift .cap{opacity:0;pointer-events:none}
.win .cap{transition:opacity .6s var(--ink)}
.win.open .hit{display:none}.win.open .crown{display:block}
.win.open .spark{opacity:0}
.win.closing .door{transition:transform 1.1s var(--slow) .3s}
.win.closing .video,.win.closing .base{opacity:0;transition:opacity .35s}
.veil{position:fixed;inset:0;background:var(--lapis);opacity:0;pointer-events:none;z-index:15;transition:opacity .7s var(--ink)}
.stage.has-open~.veil,.veil.on{opacity:.94;pointer-events:auto}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.95}}
@keyframes bloom{0%{opacity:.85}30%{opacity:1}100%{opacity:.5}}
@keyframes spark{0%{stroke-dashoffset:1}100%{stroke-dashoffset:-.035}}
@keyframes twinkle{0%,100%{stroke:var(--gold)}50%{stroke:#FFF3D6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.frame .draw{stroke-dashoffset:0!important}.win.drawing .door,.win.drawing .star{opacity:1}}

.slot>.win{width:100%;max-width:none}</style>

<script>
(function(){

function $(s, r){ return (r || document).querySelector(s); }
function ist(s){ var p = s.split(/[-T:]/).map(Number); return Date.UTC(p[0],p[1]-1,p[2],p[3]||0,p[4]||0) - 330*60000; }
var at = new URLSearchParams(location.search).get('at'), T0 = Date.now();
function now(){ return at ? ist(at) + (Date.now() - T0) : Date.now(); }
var stage = $('#stage'), veil = $('#veil'), openW = null;
function yours(t){
  try{ var d = new Date(t); if(d.getTimezoneOffset() === -330) return '';
    var s = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/:00(?=\s?[AaPp]\.?\s?[Mm])/, '');
    var day = d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate(); if(day !== 20261128) s = d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}) + ', ' + s;
    return s + ' your time'; }catch(_){ return ''; }
}
var W = {};
C.windows.forEach(function(c){
  var el = document.getElementById('w-' + c.id); W[c.id] = {c:c, el:el, state:''};
  $('.yours', el).textContent = yours(ist(c.start));
  $('.hit', el).addEventListener('click', function(){ open(c.id); });
  $('.crown', el).addEventListener('click', close);
  $('.close', el).addEventListener('click', close);
  el.classList.add('drawing');
});
function state(c, t){ return t < ist(c.from) ? 'before' : t < ist(c.until) ? 'live' : 'after'; }
function render(){
  var t = now();
  Object.keys(W).forEach(function(k){
    var w = W[k], s = state(w.c, t); if(s === w.state) return; w.state = s;
    w.el.classList.toggle('live', s === 'live'); w.el.classList.toggle('after', s === 'after');
    var when = $('.when', w.el);
    if(s === 'live') when.innerHTML = '<span class="dot"></span>' + (t < ist(w.c.start) ? 'Starting soon · touch to watch' : 'Live now · touch to watch');
    else if(s === 'after') when.textContent = w.c.rec ? 'Touch to watch again' : 'Thank you for watching';
    else when.textContent = w.c.when;
    $('.hit', w.el).disabled = !(s === 'live' || (s === 'after' && w.c.rec));
    if(s === 'live' && t >= ist(w.c.start)) $('.when', w.el).innerHTML = '<span class="dot"></span>Live now · touch to watch';
  });
}
render(); setInterval(render, 15000);

function open(k){
  if(openW) return; var w = W[k]; if(!w || !(w.state === 'live' || (w.state === 'after' && w.c.rec))) return;
  openW = k; var el = w.el, r = el.getBoundingClientRect();
  var vw = Math.min(innerWidth - 24, 520), ww = Math.min(vw, (innerHeight - 30) * 212 / 326 * 1.0);
  el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.width = r.width + 'px';
  el.classList.add('lift'); stage.classList.add('has-open'); void el.offsetWidth;
  el.style.left = ((innerWidth - ww) / 2) + 'px'; el.style.top = Math.max(12, (innerHeight - ww * 326 / 212) / 2) + 'px'; el.style.width = ww + 'px';
  el.classList.add('open');
  var src = (w.state === 'after' && w.c.rec) ? w.c.rec : w.c.src, v = $('.video', el);

  setTimeout(function(){ var b = $('.close', el); if(b) b.focus({preventScroll:true}); }, 2200);
}
function close(fromHistory){
  if(!openW) return; var w = W[openW], el = w.el, k = openW;
  el.classList.add('closing'); el.classList.remove('open');
  setTimeout(function(){ $('.video', el).innerHTML = ''; }, 400);

})();
