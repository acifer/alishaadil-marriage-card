<style>
:root{--ground:#1B2F6E;--gold:#CFAE72;--c:#CFAE72;--ivory:#F2E9D6;--quiet:#C3BBA6;--line:rgba(207,174,114,.3);--ink:cubic-bezier(.45,0,.2,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);transition:background-color 2.4s var(--ink)}
html.still,html.still body{transition:none!important}
body{color:var(--ivory);font:18px/1.5 Jost,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.view{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(44px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
#story{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center}
.logo{width:min(52vw,210px);margin:0 auto}.logo svg{display:block;width:100%;height:auto}
.kashida{display:block;width:168px;height:auto;margin:18px auto 0;fill:var(--gold);opacity:.8;overflow:visible}
.ev{margin:40px 0 0;text-align:center}
.kick{margin:0 0 6px;font:italic 400 20px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}
.ev h2{margin:0;font:400 30px/1.2 'Cormorant Garamond',Georgia,serif;text-wrap:balance}
.ev h2.long{font-size:28px}
.count{margin:0;font:500 15px/1.6 Jost,sans-serif;letter-spacing:.08em;white-space:nowrap;color:var(--gold)}
.count b{font-weight:500;color:var(--ivory);font-variant-numeric:tabular-nums}
.count .sep{width:5px;height:5px;margin:0 .55em;vertical-align:.15em}.count .sep path{fill:var(--c)}
.until{margin:2px 0 0;font:italic 400 20px/1.4 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}
@media (max-width:380px){.count{font-size:14px;letter-spacing:.04em}}
.sub{margin:8px 0 0;font-size:15px;color:var(--quiet)}
.sub.now{font:italic 400 20px 'Cormorant Garamond',Georgia,serif;color:var(--c);margin-top:4px}
.live{display:inline-flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;letter-spacing:.04em}
.live i{width:9px;height:9px;border-radius:50%;background:#D2553A;box-shadow:0 0 0 4px rgba(210,85,58,.25)}
.u.gone{display:none}
.yt{position:relative;width:100%;aspect-ratio:16/9;background:#000;margin:22px auto 0;box-shadow:0 18px 40px rgba(0,0,0,.28)}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.links{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.links a,.links button{display:inline-flex;align-items:center;min-height:44px;padding:0;background:none;border:0;cursor:pointer;
  font:italic 400 19px 'Cormorant Garamond',Georgia,serif;color:var(--ivory);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:1px;text-underline-offset:5px}
.links .lsep{width:7px;height:7px;opacity:.7}.links .lsep path{fill:var(--gold)}
/* the way in: a small envelope drawn in fine gold lines, sealed with a nuqta, and two words beneath.
   Tapped, the flap lifts, the card shows its edge, and the ink spreads from the seal into the invitation. */
.door{display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;max-width:100%;margin:40px auto 0;padding:14px 26px 10px;
  text-decoration:none;color:var(--ivory);cursor:pointer;border-radius:6px}
.env{display:block;width:96px;height:auto;overflow:visible;transition:transform .35s var(--ink)}
.env .e-card{fill:#F4ECDC;transition:transform .45s var(--ink)}
.env .e-body{fill:var(--ground);stroke:var(--gold);stroke-width:1.3;transition:fill .6s}
.env .e-fold{fill:none;stroke:var(--gold);stroke-width:1;opacity:.4}
.env .e-flap{fill:var(--ground);stroke:var(--gold);stroke-width:1.3;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 0;transition:transform .35s var(--ink),fill .2s}
.env .dot path{fill:var(--gold);transition:fill .3s}
.env .dot .halo{fill:none;stroke:var(--gold);stroke-width:.7;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{opacity:0;transform:scale(1)}15%{opacity:.6}100%{opacity:0;transform:scale(2.8)}}
.door.hint .halo{animation:halo 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.door .t{font:italic 400 25px/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;color:var(--ivory);transition:color .3s}
.door:hover .env,.door:focus-visible .env{transform:translateY(-2px)}
.door:hover .t,.door:focus-visible .t{color:#fff}
.door:hover .dot path:not(.halo){fill:#E2C891}
.door.opening .e-flap{transform:scaleY(-1);fill:transparent}
.door.opening .e-card{transform:translateY(-18px)}
.logo{cursor:pointer}
.rs{margin-top:24px;text-align:center}.rs .links{margin-top:0}
.reply{margin:-6px 0 0;font-size:13.5px;color:var(--quiet);opacity:.85}
#ink{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;display:none}
/* the RSVP form */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;font:500 16px Jost,sans-serif;letter-spacing:.02em;text-decoration:none;color:var(--ground);background:var(--gold);border:0;border-radius:2px;cursor:pointer}
.btn:disabled{opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;min-height:44px;font:italic 400 19px 'Cormorant Garamond',Georgia,serif;color:var(--ivory);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.mini{width:64px;height:auto}.top .sp{width:58px}
.head{text-align:center;margin-top:16px}
.head h2,.done h2{margin:0;font:400 32px/1.2 'Cormorant Garamond',Georgia,serif;outline:none}
.head p{margin:6px 0 0;font-size:15px;color:var(--quiet)}
.head .kashida{margin-top:14px;width:120px}
form{margin-top:24px}
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
.lab{display:block;font-size:16px;color:var(--quiet);margin:0 0 8px;padding:0}
.opt-l{font-size:14px}
input[type=text],input[type=tel],textarea{width:100%;min-height:54px;padding:12px 14px;font:18px Jost,sans-serif;color:var(--ivory);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:2px}
textarea{min-height:92px;resize:vertical}
.field{margin-bottom:22px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:2px;font-size:17px;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.opt.on{border-color:var(--gold);background:rgba(207,174,114,.10)}
.opt svg{width:18px;height:18px;flex:none}
.opt svg path{fill:none;stroke:var(--c,var(--gold));stroke-width:1.6}
.opt.on svg path{fill:var(--c,var(--gold))}
.opt small{display:block;font-size:14px;color:var(--quiet)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;width:max-content}
.step button{width:56px;height:54px;font:300 26px Jost,sans-serif;color:var(--ivory);background:transparent;border:0;cursor:pointer}
.step button:disabled{opacity:.35}
.step output{min-width:56px;text-align:center;font:500 20px Jost,sans-serif}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{min-height:1.5em;margin:0 0 8px;color:#F2B8A0;font-size:16px}
.send{width:100%}
.fine{font-size:13.5px;color:var(--quiet);text-align:center;margin-top:12px}
.done{text-align:center;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center}
.done h2{margin-top:34px}
.done p{font-size:16px;color:var(--quiet);margin:10px auto 0;max-width:30ch;text-wrap:balance}
.done .prev{font-size:14px;color:#F2C9A0;border:1px dashed rgba(242,201,160,.5);padding:8px 12px;max-width:34ch}
.done .act{display:flex;flex-direction:column;align-items:center;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
