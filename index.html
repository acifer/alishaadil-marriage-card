<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B2F6E">
<title>Alisha &amp; Aadil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--lapis:#1B2F6E;--lapis-d:#14234F;--ivory:#F4ECDC;--ivory-d:#E6DCC6;--gold:#B08C57;--gold-l:#C9A86F;--ink:#1B2F6E;
 --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:Jost,Futura,'Century Gothic','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--lapis);color:var(--ivory)}
body{font-family:var(--serif);font-size:20px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
.mark{display:block;color:var(--gold-l);height:auto}
.top{position:sticky;top:0;z-index:5;background:var(--lapis);border-bottom:1px solid rgba(201,168,111,.35);padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto}
.brand .mark{width:56px}
.names{font-size:28px;line-height:1.05}.names em{color:var(--gold-l);font-style:italic}
.sub{font-family:var(--sans);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);margin-top:4px}
.tabs{display:flex;gap:4px;max-width:760px;margin:12px auto 0}
.tabs button{flex:1;min-height:48px;font:500 15px var(--sans);letter-spacing:.02em;white-space:nowrap;color:var(--ivory-d);background:transparent;border:0;border-bottom:3px solid transparent;cursor:pointer;padding:10px 6px}
.tabs button[aria-selected=true]{color:var(--ivory);border-bottom-color:var(--gold-l)}
.tabs button:focus-visible{outline:2px solid var(--gold-l);outline-offset:-2px}
.panel{min-height:60vh}
.wrap{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l)}
h2{font-weight:400;font-size:30px;margin:0 0 10px;line-height:1.1}
h2.big{font-size:clamp(32px,7vw,46px);margin-top:6px}
.count{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.count div{background:var(--ivory);color:var(--lapis);padding:16px 10px;text-align:center}
.count b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(46px,13vw,76px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.count span{font-family:var(--sans);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.lead{font-size:22px;margin:0 0 6px}
.rule{height:1px;background:var(--gold);opacity:.6;margin:26px 0}
.prog{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;margin:8px 0 12px;font-size:22px}
.prog dt{font-family:var(--sans);font-size:16px;letter-spacing:.06em;color:var(--gold-l);padding-top:4px}.prog dd{margin:0}
.tz{font-size:17px;color:var(--ivory-d);margin:6px 0 0}
.venue{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--ivory);color:var(--lapis);padding:18px;margin-top:22px}
.vname{font-size:28px;line-height:1.1;margin-top:2px}.addr{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;font:600 16px var(--sans);letter-spacing:.06em;background:var(--gold);color:var(--lapis);text-decoration:none;border:0;cursor:pointer}
.venue .btn{background:var(--lapis);color:var(--ivory)}
.btn.ghost{background:transparent;color:var(--ivory);border:1.5px solid var(--gold-l)}
.btn:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
.soon{font-size:20px;color:var(--ivory-d);border:1px dashed var(--gold);padding:14px 16px;margin:14px 0 0}
#liveAction .btn{margin-top:14px;font-size:18px;min-height:56px;padding:14px 28px}
.qrbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qr{width:200px;height:200px;display:block;flex:none;background:#F4ECDC}
.qrbox p{margin:6px 0 12px;font-size:19px;max-width:34ch}
.copied{font-family:var(--sans);font-size:14px;color:var(--gold-l);min-height:1.4em;margin-top:8px;word-break:break-all}
.card-panel{display:flex;flex-direction:column}
.cardbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:760px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));font-family:var(--sans);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l)}
.cardbar .btn{min-height:44px;padding:8px 14px;font-size:14px;text-transform:none;letter-spacing:.04em}
.frame{flex:1;height:calc(100dvh - 210px);min-height:520px;border-top:1px solid rgba(201,168,111,.35)}
.frame iframe{width:100%;height:100%;border:0;display:block;background:var(--lapis)}
.foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:26px 16px 40px;font-size:17px;color:var(--ivory-d)}
.foot .mark{width:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="aagate" style="position:fixed;inset:0;z-index:2147483000;background:#1B2F6E;color:#F4ECDC;display:flex;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;font-family:'Cormorant Garamond',Georgia,serif">
<form id="aagf" style="width:min(100%,380px);display:flex;flex-direction:column;gap:14px;text-align:center;margin:auto">
<div style="height:1px;background:#B08C57;width:64px;margin:0 auto 6px"></div>
<div style="font-family:Jost,Futura,sans-serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#C9A86F">Welcome</div>

<p style="margin:0;font-size:20px;line-height:1.4;color:#E6DCC6">Open the link from your message, or enter the word the family gave you.</p>

<input id="gp" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" style="font:500 20px Jost,Futura,sans-serif;padding:14px 16px;border:1.5px solid #B08C57;background:#F4ECDC;color:#1B2F6E;text-align:center">
<label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:18px;color:#E6DCC6"><input type="checkbox" id="gs" style="width:20px;height:20px;margin:0"> Show the word</label>
<button id="gb" type="submit" style="font:600 17px Jost,Futura,sans-serif;letter-spacing:.08em;background:#B08C57;color:#1B2F6E;border:0;padding:14px 16px;min-height:48px;cursor:pointer">Open</button>

</form></div>
